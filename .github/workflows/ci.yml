name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The suite uses an in-memory database and a stand-in for the LLM
      # providers, so it needs no secrets, network services or API keys.
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Errors fail the build; existing warnings and info-level lints
      # don't, so this can be tightened once those are cleaned up.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
